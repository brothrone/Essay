# Essay 백엔드 (Cloudflare Workers + D1). 배포 방법은 guides/서버-안내.md
name = "essay-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# 주소: https://api.essay.win (essay.win 은 이 Cloudflare 계정에서 산 도메인)
routes = [{ pattern = "api.essay.win", custom_domain = true }]
# 계정 이름이 들어가는 *.workers.dev 주소와 미리보기 주소는 쓰지 않는다
workers_dev = false
preview_urls = false

[observability]
enabled = true

# 매일 한 번 정리 (횟수 제한 기록 · 오래된 통계)
[triggers]
crons = ["17 18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "essay"
# `npx wrangler d1 create essay` 로 만든 실제 데이터베이스 (2026-10-10, APAC)
database_id = "255f660f-2789-4125-bba7-289da5c91099"
migrations_dir = "migrations"

[vars]
# 한 연결(IP)에서 받을 의견 수 한도
FEEDBACK_PER_HOUR = "5"
FEEDBACK_PER_DAY = "20"
# 유료 판매: 이용권 값(원, 정가는 표시용). 상점 ID · 채널 키는 포트원 가입 뒤 채운다(공개 값)
PRICE = "3900"
LIST_PRICE = "4900"
PORTONE_STORE_ID = ""
# 결제 수단은 카카오페이 · 네이버페이만(사용자 결정 2026-10-10). 채널 키를 넣은 것만 구매 페이지에 버튼이 나온다
PORTONE_CHANNEL_KAKAOPAY = ""
PORTONE_CHANNEL_NAVERPAY = ""
# 결제를 켜는 날 "1" 로 (그 뒤로 새 기기는 '먼저 쓰던 사람' 확인증을 못 받는다). 앱 쪽 docs/app-config.json 의 billing.enabled 와 같은 날 바꾼다
BILLING_LIVE = "0"

# 비밀 값은 여기 쓰지 않는다. 배포 전에 한 번:
#   npx wrangler secret put ADMIN_TOKEN   (관리용 주소 열쇠, 긴 무작위 문자열)
#   npx wrangler secret put IP_SALT       (IP 를 그대로 저장하지 않고 섞어서 저장할 때 쓰는 값, 긴 무작위 문자열)
#   npx wrangler secret put LICENSE_PRIVATE_KEY  (이용권 등록증 서명 키, Ed25519 PKCS8 base64 — 공개 키는 앱 electron/billing.cjs 에)
#   npx wrangler secret put PORTONE_API_SECRET   (포트원 V2 API 비밀 값, 포트원 가입 뒤)
#   npx wrangler secret put PORTONE_WEBHOOK_SECRET  (포트원 콘솔 결제알림(Webhook)의 whsec_… 비밀 값)
# 로컬 개발은 .dev.vars 파일에 같은 이름으로 (저장소에 올리지 않음)
